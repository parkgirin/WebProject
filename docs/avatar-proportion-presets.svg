<svg xmlns="http://www.w3.org/2000/svg" width="1712" height="650" viewBox="0 0 1712 650">
  <title>아바타 체형 프리셋 정면 및 측면 통합 비교</title>
  <desc>정면과 측면 모두 원형 관절과 직사각형 연결부만으로 표현한 체형 프리셋 비교 도면.</desc>
