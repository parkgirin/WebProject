<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="520" viewBox="0 0 1024 520" role="img" aria-labelledby="title desc">
  <title id="title">토끼 정면과 측면 체형</title>
  <desc id="desc">관절 구조를 겹쳐 표시한 토끼의 정면 및 측면 실루엣. 점선 귀는 선택 도형이다.</desc>
  <defs>
    <style>
      .background { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke: #ded9d0; stroke-width: 1.5; }
      .body { fill: #dca27b; stroke: #6f5544; stroke-width: 2.5; stroke-linejoin: round; }
      .rear { fill: #cf9169; stroke: #6f5544; stroke-width: 2.5; }
      .ear { fill: #efd0bb; stroke: #8e7a6d; stroke-width: 2; stroke-dasharray: 7 6; }
      .skeleton { fill: none; stroke: #725ea8; stroke-width: 2; stroke-dasharray: 6 6; }
      .joint { fill: #ffffff; stroke: #725ea8; stroke-width: 2.5; }
      .axis { fill: none; stroke: #d8d2ca; stroke-width: 1.5; stroke-dasharray: 5 7; }
      .ground { stroke: #c9c2b8; stroke-width: 1.5; }
      .label { fill: #312c28; font-family: system-ui, sans-serif; font-size: 22px; font-weight: 600; }
      .note { fill: #746d66; font-family: system-ui, sans-serif; font-size: 14px; }
    </style>
  </defs>

  <rect class="background" width="1024" height="520" />
  <rect class="panel" x="24" y="24" width="460" height="472" rx="18" />
  <rect class="panel" x="500" y="24" width="500" height="472" rx="18" />

