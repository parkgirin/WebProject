  <text class="note" x="254" y="84" text-anchor="middle">좌우 대칭 · 넓은 뒷다리</text>
  <line class="axis" x1="254" y1="92" x2="254" y2="456" />
  <line class="ground" x1="80" y1="452" x2="428" y2="452" />

  <ellipse class="ear" cx="224" cy="146" rx="18" ry="58" transform="rotate(-8 224 146)" />
  <ellipse class="ear" cx="284" cy="146" rx="18" ry="58" transform="rotate(8 284 146)" />
  <ellipse class="body" cx="254" cy="301" rx="66" ry="78" />
  <ellipse class="rear" cx="177" cy="350" rx="55" ry="61" transform="rotate(13 177 350)" />
  <ellipse class="rear" cx="331" cy="350" rx="55" ry="61" transform="rotate(-13 331 350)" />
  <circle class="body" cx="254" cy="202" r="67" />
