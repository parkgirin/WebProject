<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="520" viewBox="0 0 1024 520" role="img" aria-labelledby="title desc">
  <title id="title">토끼 정면과 측면 체형</title>
  <desc id="desc">한국 집토끼의 작고 둥근 체형을 기준으로, 원형 관절과 사각형 링크만으로 구성한 정면 및 측면 실루엣. 뒷다리는 골반, 무릎, 비절, 발 순서로 배치한다.</desc>
  <defs>
    <style>
      .background { fill: #fbfaf7; }
      .panel { fill: #ffffff; stroke: #ded9d0; stroke-width: 1.5; }
      .link { fill: #dca27b; stroke: #6f5544; stroke-width: 2.5; }
      .extremity { fill: #cf9169; stroke: #6f5544; stroke-width: 2.5; }
      .tail { fill: #efd0bb; stroke: #6f5544; stroke-width: 2.5; }
      .ear { fill: #efd0bb; stroke: #8e7a6d; stroke-width: 2; stroke-dasharray: 7 6; }
      .joint { fill: #efd0bb; stroke: #6f5544; stroke-width: 2.5; }
      .axis { fill: none; stroke: #d8d2ca; stroke-width: 1.5; stroke-dasharray: 5 7; }
      .ground { stroke: #c9c2b8; stroke-width: 1.5; }
      .label { fill: #312c28; font-family: system-ui, sans-serif; font-size: 22px; font-weight: 600; }
      .note { fill: #746d66; font-family: system-ui, sans-serif; font-size: 14px; }
    </style>
  </defs>

  <rect class="background" width="1024" height="520" />
  <rect class="panel" x="24" y="24" width="460" height="472" rx="18" />
  <rect class="panel" x="500" y="24" width="500" height="472" rx="18" />

  <text class="label" x="254" y="60" text-anchor="middle">정면</text>
  <text class="note" x="254" y="84" text-anchor="middle">한국 집토끼 · 둥근 몸통 · 짧은 앞다리</text>
  <line class="axis" x1="254" y1="92" x2="254" y2="456" />
  <line class="ground" x1="80" y1="452" x2="428" y2="452" />

  <ellipse class="ear" cx="224" cy="154" rx="20" ry="50" transform="rotate(-8 224 154)" />
  <ellipse class="ear" cx="284" cy="154" rx="20" ry="50" transform="rotate(8 284 154)" />
  <g aria-label="정면 관절 연결 실루엣">
    <rect class="link" x="242" y="202" width="24" height="99"/><rect class="link" x="210" y="269" width="24" height="121"/><rect class="link" x="274" y="269" width="24" height="121"/>
    <rect class="link" x="0" y="-22" width="68" height="44" transform="translate(254 301) rotate(160)"/><rect class="link" x="0" y="-16" width="51" height="32" transform="translate(190 325) rotate(118)"/><rect class="link" x="0" y="-20" width="35" height="40" transform="translate(166 370) rotate(84)"/>
    <rect class="link" x="0" y="-22" width="68" height="44" transform="translate(254 301) rotate(20)"/><rect class="link" x="0" y="-16" width="51" height="32" transform="translate(318 325) rotate(62)"/><rect class="link" x="0" y="-20" width="35" height="40" transform="translate(342 370) rotate(96)"/>
  </g>
  <ellipse class="extremity" cx="222" cy="390" rx="22" ry="30"/>
  <ellipse class="extremity" cx="286" cy="390" rx="22" ry="30"/>
  <ellipse class="extremity" cx="170" cy="405" rx="39" ry="20" transform="rotate(-5 170 405)"/>
  <ellipse class="extremity" cx="338" cy="405" rx="39" ry="20" transform="rotate(5 338 405)"/>
  <g aria-hidden="true">
    <circle class="joint" cx="254" cy="202" r="52"/><circle class="joint" cx="254" cy="257" r="40"/><circle class="joint" cx="254" cy="301" r="58"/>
    <circle class="joint" cx="222" cy="269" r="18"/><circle class="joint" cx="222" cy="326" r="15"/>
    <circle class="joint" cx="286" cy="269" r="18"/><circle class="joint" cx="286" cy="326" r="15"/>
    <circle class="joint" cx="190" cy="325" r="42"/><circle class="joint" cx="166" cy="370" r="27"/>
    <circle class="joint" cx="318" cy="325" r="42"/><circle class="joint" cx="342" cy="370" r="27"/>
  </g>

  <text class="label" x="750" y="60" text-anchor="middle">측면</text>
  <text class="note" x="750" y="84" text-anchor="middle">낮고 둥근 몸통 · 작은 구형 꼬리 · 골반 → 무릎 → 비절 → 발</text>
  <line class="ground" x1="534" y1="452" x2="966" y2="452" />

  <ellipse class="ear" cx="852" cy="154" rx="20" ry="55" transform="rotate(14 852 154)" />
  <ellipse class="ear" cx="886" cy="158" rx="18" ry="50" transform="rotate(24 886 158)" />
  <circle class="tail" cx="620" cy="310" r="23"/>
  <g aria-label="측면 관절 연결 실루엣">
    <rect class="link" x="0" y="-24" width="64" height="48" transform="translate(858 232) rotate(139)"/><rect class="link" x="0" y="-32" width="47" height="64" transform="translate(810 274) rotate(159)"/><rect class="link" x="0" y="-38" width="47" height="76" transform="translate(766 291) rotate(165)"/>
    <rect class="link" x="0" y="-12" width="30" height="24" transform="translate(810 274) rotate(60)"/><rect class="link" x="813" y="300" width="24" height="94"/>
    <rect class="link" x="0" y="-12" width="56" height="24" transform="translate(810 274) rotate(29)"/><rect class="link" x="848" y="302" width="24" height="94"/>
    <rect class="link" x="0" y="-38" width="49" height="76" transform="translate(721 303) rotate(122)"/><rect class="link" x="0" y="-22" width="76" height="44" transform="translate(695 344) rotate(154)"/><rect class="link" x="0" y="-28" width="56" height="56" transform="translate(627 377) rotate(30)"/>
  </g>
  <ellipse class="extremity" cx="824" cy="394" rx="18" ry="29"/>
  <ellipse class="extremity" cx="860" cy="396" rx="18" ry="29"/>
  <ellipse class="extremity" cx="675" cy="405" rx="48" ry="20" transform="rotate(-4 675 405)"/>
  <g aria-hidden="true">
    <circle class="joint" cx="858" cy="232" r="52"/><circle class="joint" cx="810" cy="274" r="34"/><circle class="joint" cx="766" cy="291" r="48"/><circle class="joint" cx="721" cy="303" r="60"/>
    <circle class="joint" cx="825" cy="300" r="18"/><circle class="joint" cx="824" cy="354" r="15"/>
    <circle class="joint" cx="858" cy="302" r="18"/><circle class="joint" cx="860" cy="356" r="15"/>
    <circle class="joint" cx="695" cy="344" r="42"/><circle class="joint" cx="627" cy="377" r="27"/>
  </g>

  <text class="note" x="512" y="486">점선 귀: 자유 도형으로 선택 적용</text>
</svg>
